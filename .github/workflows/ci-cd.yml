name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Exécuter les tests unitaires
        run: python -m unittest discover -s tests -v

  e2e-tests:
    name: Tests E2E
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests
      - name: Démarrer l'application
        run: |
          python app.py > app.log 2>&1 &
          sleep 5
      - name: Vérifier la disponibilité
        run: curl --fail http://localhost:8080/health
      - name: Exécuter les tests E2E
        run: pytest e2e/ -v

  docker-build-push:
    name: Build & Push Docker Hub
    needs:
      - unit-tests
      - e2e-tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mon-app:latest

  deploy:
    name: Deploy sur VM Azure
    needs:
      - docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Installer la clé SSH
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Ajouter la VM aux known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Déployer sur la VM
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" << EOF
            set -e
            docker pull "$DOCKERHUB_USERNAME/mon-app:latest"
            docker rm -f myapp 2>/dev/null || true
            docker run -d               --name myapp               --restart unless-stopped               -p 8094:8080               "$DOCKERHUB_USERNAME/mon-app:latest"
            sleep 5
            curl --fail http://localhost:8094/health
          EOF

      - name: Vérifier via l'IP publique
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: curl --fail "http://$SSH_HOST:8094/health"
